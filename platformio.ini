; PlatformIO Project Configuration File
; Sistema de Senhas - Lanchonete (Wokwi)
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
build_dir = .pio/build

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Bibliotecas necessárias
lib_deps =
    bblanchon/ArduinoJson@^7
    chris--a/Keypad@^3.1
    marcoschwartz/LiquidCrystal_I2C@^1.1
    links2004/WebSockets@^2.3

; Configurações de build
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wl,-u,ldCheckResetCause
    -Wno-deprecated-declarations

; Upload (ajuste a porta se necessário)
; upload_port = COM3

; Partição para mais espaço (opcional)
; board_build.partitions = default_16MB.csv

[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Para simulação Wokwi - usa as mesmas libs
lib_deps =
    bblanchon/ArduinoJson@^7
    chris--a/Keypad@^3.1
    marcoschwartz/LiquidCrystal_I2C@^1.1
    links2004/WebSockets@^2.3

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wno-deprecated-declarations