[project]
name = "Sistema de Senhas - Lanchonete"
description = "ESP32 com LCD 16x2 I2C, Keypad 4x4, Buzzer, LEDs e WebSocket"
version = "1.0.0"
author = "BrunoSevero-188"

[wokwi]
simulation = "esp32"

[files]
sketch = "sketch.ino"
diagram = "diagram.json"
libraries = "libraries.txt"

[build]
flags = [
  "-DCORE_DEBUG_LEVEL=0",
  "-Wno-deprecated-declarations"
]

[monitor]
baud = 115200

[web]
port = 80
ws_port = 81